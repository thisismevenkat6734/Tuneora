<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Tuneora - Profile</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #080808;
      color: #fff;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;
    }

    .profile-container {
      width: 100%;
      max-width: 430px;

      background: #151515;
      border: 1px solid #292929;
      border-radius: 22px;

      padding: 35px 28px;

      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo h1 {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .logo span {
      color: #ff2d8d;
    }

    .logo p {
      margin-top: 8px;
      color: #999;
      font-size: 14px;
    }

    .avatar {
      width: 90px;
      height: 90px;

      margin: 0 auto 20px;

      border-radius: 50%;

      background: linear-gradient(
        135deg,
        #ff2d8d,
        #ff5b35
      );

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 38px;
      font-weight: bold;
    }

    h2 {
      text-align: center;
      font-size: 26px;
      margin-bottom: 8px;
    }

    .email {
      text-align: center;
      color: #999;
      font-size: 14px;
      margin-bottom: 30px;
      word-break: break-word;
    }

    .info-card {
      background: #0d0d0d;
      border: 1px solid #292929;
      border-radius: 14px;

      padding: 17px;
      margin-bottom: 12px;
    }

    .info-label {
      color: #888;
      font-size: 12px;
      margin-bottom: 6px;
    }

    .info-value {
      color: #fff;
      font-size: 15px;
      word-break: break-word;
    }

    .logout-btn {
      width: 100%;

      border: none;
      border-radius: 12px;

      padding: 15px;
      margin-top: 20px;

      background: linear-gradient(
        135deg,
        #ff2d8d,
        #ff5b35
      );

      color: white;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;
    }

    .back {
      display: block;

      text-align: center;

      margin-top: 20px;

      color: #999;

      text-decoration: none;

      font-size: 14px;
    }

    .loading {
      text-align: center;
      color: #999;
      padding: 30px;
    }

    .message {
      display: none;

      margin-top: 15px;
      padding: 12px;

      border-radius: 10px;

      text-align: center;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="profile-container">

    <div class="logo">
      <h1>Tune<span>ora</span></h1>
      <p>Your music. Your world.</p>
    </div>

    <div id="loading" class="loading">
      Loading profile...
    </div>

    <div id="profileContent" style="display:none;">

      <div class="avatar" id="avatar">
        T
      </div>

      <h2 id="userName">
        User
      </h2>

      <p class="email" id="userEmail">
        email@example.com
      </p>

      <div class="info-card">

        <div class="info-label">
          FULL NAME
        </div>

        <div class="info-value" id="profileName">
          -
        </div>

      </div>

      <div class="info-card">

        <div class="info-label">
          EMAIL ADDRESS
        </div>

        <div class="info-value" id="profileEmail">
          -
        </div>

      </div>

      <div class="info-card">

        <div class="info-label">
          USER ID
        </div>

        <div class="info-value" id="profileUid">
          -
        </div>

      </div>

      <div class="info-card">

        <div class="info-label">
          ACCOUNT CREATED
        </div>

        <div class="info-value" id="createdDate">
          -
        </div>

      </div>

      <button
        class="logout-btn"
        id="logoutBtn"
      >
        Logout
      </button>

      <div
        class="message"
        id="message"
      ></div>

      <a
        href="index.html"
        class="back"
      >
        ← Back to Tuneora
      </a>

    </div>

  </div>


  <script type="module">

    import { auth, db } from "./js/firebase.js";

    import {
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

    import {
      doc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


    const loading =
      document.getElementById("loading");

    const profileContent =
      document.getElementById("profileContent");

    const avatar =
      document.getElementById("avatar");

    const userName =
      document.getElementById("userName");

    const userEmail =
      document.getElementById("userEmail");

    const profileName =
      document.getElementById("profileName");

    const profileEmail =
      document.getElementById("profileEmail");

    const profileUid =
      document.getElementById("profileUid");

    const createdDate =
      document.getElementById("createdDate");

    const logoutBtn =
      document.getElementById("logoutBtn");

    const message =
      document.getElementById("message");


    function showMessage(text, success = false) {

      message.style.display = "block";

      message.textContent = text;

      if (success) {

        message.style.background = "#12351f";
        message.style.color = "#55e88a";

      } else {

        message.style.background = "#35151b";
        message.style.color = "#ff7185";

      }
    }


    onAuthStateChanged(auth, async (user) => {

      if (!user) {

        window.location.href = "login.html";

        return;
      }


      try {

        let name =
          user.displayName || "Tuneora User";

        let email =
          user.email || "No email";


        // Load additional profile data from Firestore
        const userRef =
          doc(db, "users", user.uid);

        const userSnap =
          await getDoc(userRef);


        if (userSnap.exists()) {

          const data =
            userSnap.data();

          if (data.name) {
            name = data.name;
          }

        }


        // Display user information
        userName.textContent = name;

        userEmail.textContent = email;

        profileName.textContent = name;

        profileEmail.textContent = email;

        profileUid.textContent = user.uid;


        // Avatar first letter
        avatar.textContent =
          name.charAt(0).toUpperCase();


        // Account creation date
        if (user.metadata.creationTime) {

          const date =
            new Date(user.metadata.creationTime);

          createdDate.textContent =
            date.toLocaleDateString(
              "en-IN",
              {
                day: "2-digit",
                month: "long",
                year: "numeric"
              }
            );

        } else {

          createdDate.textContent =
            "Not available";

        }


        loading.style.display = "none";

        profileContent.style.display = "block";


      } catch (error) {

        console.error(error);

        loading.textContent =
          "Unable to load profile.";

      }

    });


    logoutBtn.addEventListener(
      "click",
      async () => {

        logoutBtn.disabled = true;

        logoutBtn.textContent =
          "Logging out...";


        try {

          await signOut(auth);

          window.location.href =
            "login.html";

        } catch (error) {

          console.error(error);

          showMessage(
            "Unable to logout. Please try again."
          );

          logoutBtn.disabled = false;

          logoutBtn.textContent =
            "Logout";

        }

      }
    );

  </script>

</body>

</html>
