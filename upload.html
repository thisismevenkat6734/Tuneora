<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Tuneora — Upload Music</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #080808;
            color: #ffffff;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .upload-container {
            width: 100%;
            max-width: 500px;

            background: #151515;

            border: 1px solid #292929;
            border-radius: 22px;

            padding: 32px 28px;

            box-shadow:
                0 20px 60px rgba(0,0,0,0.5);
        }

        .logo {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo h1 {
            font-size: 34px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .logo span {
            color: #ff2d8d;
        }

        .logo p {
            margin-top: 8px;
            color: #999;
            font-size: 14px;
        }

        h2 {
            font-size: 25px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #999;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 13px;
            color: #bbb;
            margin-bottom: 8px;
        }

        input,
        select,
        textarea {

            width: 100%;

            padding: 14px;

            border-radius: 12px;

            border: 1px solid #333;

            background: #0d0d0d;

            color: #ffffff;

            font-size: 15px;

            outline: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #ff2d8d;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        input[type="file"] {
            padding: 12px;
            cursor: pointer;
        }

        .file-info {
            margin-top: 7px;
            font-size: 12px;
            color: #777;
        }

        .upload-btn {

            width: 100%;

            border: none;

            border-radius: 12px;

            padding: 15px;

            margin-top: 8px;

            background:
                linear-gradient(
                    135deg,
                    #ff2d8d,
                    #ff5b35
                );

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        .upload-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .progress-container {
            display: none;
            margin-top: 20px;
        }

        .progress-text {
            display: flex;
            justify-content: space-between;

            font-size: 13px;
            color: #aaa;

            margin-bottom: 8px;
        }

        .progress-track {

            width: 100%;
            height: 8px;

            background: #292929;

            border-radius: 20px;

            overflow: hidden;
        }

        .progress-bar {

            width: 0%;
            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    #ff2d8d,
                    #ff5b35
                );

            transition: width 0.2s;
        }
